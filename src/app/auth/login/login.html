<form class="p-fluid flex flex-column gap-4 w-full" (ngSubmit)="login()">

  <!-- Email -->
  <div class="flex flex-column gap-2 w-full">
    <label for="email" class="font-medium">Email</label>
    <p-inputGroup class="w-full">
      <p-inputGroupAddon>
        <i class="pi pi-envelope"></i>
      </p-inputGroupAddon>
      <input pInputText id="email" type="email" class="w-full" placeholder="Entrez votre email" [(ngModel)]="email" name="email" autocomplete="email" />
    </p-inputGroup>
  </div>

  <!-- Password -->
  <div class="flex flex-column gap-2 w-full">
    <label for="password" class="font-medium">Mot de passe</label>
    <p-inputGroup class="w-full">
      <p-inputGroupAddon>
        <i class="pi pi-lock"></i>
      </p-inputGroupAddon>
      <input pInputText id="password" type="password" class="w-full" placeholder="Entrez votre mot de passe" [(ngModel)]="password" name="password" autocomplete="current-password" />
    </p-inputGroup>
  </div>

  <!-- Button -->
  <button pButton type="submit" class="w-full" label="Se connecter" icon="pi pi-sign-in" [disabled]="!email || !password">
  </button>

  <!-- Separator -->
  <div class="flex align-items-center my-3">
    <div class="flex-1 border-top-1 surface-border"></div>
    <span class="px-3 text-color-secondary text-sm">OU</span>
    <div class="flex-1 border-top-1 surface-border"></div>
  </div>

  <!-- Google -->
  <button pButton type="button" class="w-full p-button-outlined" icon="pi pi-google" label="Continuer avec Google" (click)="loginWithGoogle()">
  </button>

  <!-- GitHub -->
  <button pButton type="button" class="w-full p-button-outlined mt-2" icon="pi pi-github" label="Continuer avec GitHub" (click)="loginWithGithub()">
  </button>
</form>
